<!doctype html>
<html lang="en" class="floating-window">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Ivo</title>
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link rel="stylesheet" href="./src/styles/floating-palette.css" />
  </head>
  <body class="palette-window">
    <main class="palette-surface" tabindex="-1" aria-label="Floating panel">
      <section class="canvas-properties context-panel-group">
        <div class="canvas-panel-microbar" data-palette-handle>
          <button data-palette-close aria-label="Close panel" title="Close panel"></button>
          <button
            data-palette-collapse
            aria-label="Collapse panel"
            title="Collapse panel"
            aria-expanded="true"
          ></button>
        </div>
        <header class="context-panel-header" data-palette-handle>
          <div class="canvas-panel-tabs"><span class="palette-title" data-palette-name></span></div>
          <button
            data-palette-menu
            aria-haspopup="menu"
            aria-label="Panel menu"
            aria-expanded="false"
            title="Panel menu"
          ></button>
        </header>
        <span data-palette-context class="palette-context"></span>
        <div class="canvas-panel-content" aria-live="off"></div>
      </section>
    </main>
    <script type="module" src="./src/platform/floating-palette.js"></script>
  </body>
</html>
