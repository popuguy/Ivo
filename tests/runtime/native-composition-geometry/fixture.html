<!doctype html><meta charset="utf-8" />
<link rel="stylesheet" href="../../../src/styles/index.css" />
<div
  id="viewport"
  style="position: relative; width: 960px; height: 650px; overflow: hidden; background: #eef0f2"
>
  <div
    id="camera"
    style="
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      zoom: 1.3;
      transform: translate3d(30px, 20px, 0);
    "
  >
    <div id="frames"></div>
    <div
      id="input"
      class="rich-text canvas-text"
      contenteditable="true"
      spellcheck="false"
      style="
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
        height: 90px;
        opacity: 0;
        pointer-events: none;
      "
    ></div>
  </div>
</div>
<script type="module" src="fixture.js"></script>
