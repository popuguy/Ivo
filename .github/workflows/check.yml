name: Check Ivo
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: check-ivo-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  select-checks:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: node scripts/ci-check-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.select.outputs.mode == 'docs'
        env:
          BASE: ${{ steps.select.outputs.base }}
        run: |
          git diff --check "$BASE" "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --check README.md CONTRIBUTING.md AGENTS.md 'docs/**/*.md'
  shared-engine:
    needs: select-checks
    if: needs.select-checks.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: ivo-static-preview
          path: dist/
          retention-days: 14
  native-storage:
    needs: select-checks
    if: needs.select-checks.outputs.mode == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:native
  ios-build:
    needs: select-checks
    if: needs.select-checks.outputs.mode == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run ios:prepare
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  desktop-editor:
    needs: select-checks
    if: needs.select-checks.outputs.mode == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:runtime
      - name: Qualify desktop input
        run: npm run test:release-input
        env:
          IVO_LATENCY_REPORT_DIR: ${{ runner.temp }}/ivo-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-input-timings
          path: ${{ runner.temp }}/ivo-input/
          if-no-files-found: ignore
          retention-days: 14
